[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "importgate"
version = "0.1.0"
description = "Zero-dependency Python AST checker for undeclared imports, phantom transitive dependencies, and slopsquatting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Evan Mercer", email = "356857887+evan-mercer-dev@users.noreply.github.com" }
]
keywords = ["ast", "supply-chain", "security", "dependencies", "lockfile", "static-analysis", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/evan-mercer-dev/importgate"
Repository = "https://github.com/evan-mercer-dev/importgate"
Issues = "https://github.com/evan-mercer-dev/importgate/issues"

[project.scripts]
importgate = "importgate.cli:main"

[tool.setuptools.packages.find]
include = ["importgate*"]
